<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Auto Refresh Plus</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <img src="icons/icon-48.png" alt="" class="logo" width="36" height="36">
    <div class="header-copy">
      <h1>Auto Refresh Plus</h1>
      <p class="tab-title" id="tab-title" data-i18n="tabFallback">This tab</p>
    </div>
    <span class="state-pill" id="state-pill" data-i18n="statusOff">Off</span>
  </header>

  <section class="status-card" id="status-card" data-i18n-aria-label="statusAria" aria-label="Refresh status">
    <div class="ring" id="ring">
      <div class="ring-inner">
        <span class="countdown" id="countdown">—</span>
        <span class="ring-label" id="ring-label" data-i18n="ringReady">ready</span>
      </div>
    </div>
    <div class="status-meta">
      <p class="status-title" id="status-title" data-i18n="statusTitleOff">Auto refresh is off</p>
      <p class="status-sub" id="status-sub" data-i18n="statusSubOff">Choose an interval and press start.</p>
      <p class="reloads" id="reloads"></p>
    </div>
  </section>

  <form id="settings-form" novalidate>
    <fieldset id="settings-fields">
      <legend class="sr-only" data-i18n="settingsLegend">Refresh settings</legend>

      <div class="interval-block" id="interval-block">
        <div class="section-head">
          <label for="interval" data-i18n="intervalLabel">Refresh interval</label>
          <div class="presets" id="presets" data-i18n-aria-label="presetsAria" aria-label="Quick presets">
            <button type="button" class="preset" data-seconds="5">5 s</button>
            <button type="button" class="preset" data-seconds="10">10 s</button>
            <button type="button" class="preset" data-seconds="30">30 s</button>
            <button type="button" class="preset" data-seconds="60">1 min</button>
            <button type="button" class="preset" data-seconds="300">5 min</button>
            <button type="button" class="preset" data-seconds="900">15 min</button>
          </div>
        </div>
        <div class="interval-row">
          <input type="number" id="interval" min="1" max="86400" step="1" value="30" inputmode="numeric">
          <span class="unit" data-i18n="intervalUnit">seconds</span>
        </div>
      </div>

      <label class="switch-row">
        <span class="switch-copy">
          <strong data-i18n="randomTitle">Random interval</strong>
          <small data-i18n="randomDescription">Pick a random delay before each refresh</small>
        </span>
        <input type="checkbox" id="random">
        <span class="switch" aria-hidden="true"></span>
      </label>

      <div class="random-row" id="random-row" hidden>
        <label class="random-field">
          <span data-i18n="minLabel">Min</span>
          <span class="input-with-unit">
            <input type="number" id="min" min="1" max="86400" step="1" value="15" inputmode="numeric">
            <span data-i18n="unitSecondsShort">s</span>
          </span>
        </label>
        <label class="random-field">
          <span data-i18n="maxLabel">Max</span>
          <span class="input-with-unit">
            <input type="number" id="max" min="1" max="86400" step="1" value="45" inputmode="numeric">
            <span data-i18n="unitSecondsShort">s</span>
          </span>
        </label>
      </div>

      <label class="check-row">
        <input type="checkbox" id="bypass-cache">
        <span data-i18n="bypassCacheLabel">Bypass cache (hard refresh)</span>
      </label>
    </fieldset>

    <p class="error" id="error" hidden></p>

    <div class="actions">
      <button type="submit" class="primary" id="toggle" data-i18n="startButton">Start</button>
      <button type="button" class="secondary" id="refresh-now" data-i18n="refreshNowButton">Refresh now</button>
    </div>
  </form>

  <footer>
    <span data-i18n="footerScope">Applies to this tab only</span>
    <kbd>Alt+Shift+R</kbd>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
